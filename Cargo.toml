[package]
name = "openengine"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Local animated wallpaper for Windows"

[[bin]]
name = "OpenEngine"
path = "src/main.rs"

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
serde_json = { version = "1", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem",
  "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security",
  "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
