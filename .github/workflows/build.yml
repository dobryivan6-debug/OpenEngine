name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust
        run: rustup toolchain install stable-x86_64-pc-windows-msvc --profile minimal
      - name: Compile release binary
        run: cargo +stable-x86_64-pc-windows-msvc build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: OpenEngine-windows-x64
          path: target/release/OpenEngine.exe
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OpenEngine-windows-x64
          path: dist
      - name: Archive sources
        run: git archive --format=zip --prefix=OpenEngine/ --output=dist/OpenEngine-source.zip HEAD
      - name: Publish release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME --verify-tag --generate-notes dist/OpenEngine.exe dist/OpenEngine-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
